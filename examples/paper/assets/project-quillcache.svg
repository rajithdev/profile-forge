<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 196" width="442" height="196" role="img" aria-labelledby="t d">
  <title id="t">Quillcache</title>
  <desc id="d">A tiny read-through cache server with tag-based invalidation and a Redis-compatible API. Built with Rust, Tokio, RESP.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".5" stop-color="#7c3aed" stop-opacity=".8"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="1" cy="0" r=".9">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".14"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .tag { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #7c3aed; }
    .live { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #78716c; }
    .ttl { font: 600 21px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1c1917; }
    .dsc { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #78716c; }
    .stk { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.2px; fill: #44403c; }
    .dot { animation: pulse 2s ease-in-out infinite; transform-origin: 368px 32px; }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1) } 50% { opacity: 0; transform: scale(2.6) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="442" height="196" rx="16" fill="#fffdf8"/>
  <rect width="442" height="196" rx="16" fill="url(#halo)"/>
  <rect x=".5" y=".5" width="441" height="195" rx="15.5" fill="none" stroke="#a8a29e" stroke-opacity=".2"/>
  <rect x="22" y="0" width="398" height="1" fill="url(#top)"/>

  <text class="tag" x="24" y="36">INFRASTRUCTURE</text>
  
  <text class="ttl" x="24" y="78">Quillcache</text>
  <text class="dsc" x="24" y="106">A tiny read-through cache server with tag-based invalidation</text>
  <text class="dsc" x="24" y="126">and a Redis-compatible API.</text>
  <rect x="24" y="150" width="394" height="1" fill="#a8a29e" fill-opacity=".16"/>
  <text class="stk" x="24" y="174">RUST · TOKIO · RESP</text>
</svg>
