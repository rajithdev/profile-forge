<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900" height="336" role="img" aria-labelledby="t d">
  <title id="t">Driftboard</title>
  <desc id="d">Realtime boards: Every card, comment and cursor syncs the moment it changes. Instant sync: Conflict-free edits over WebSockets. Presence: See who is looking at what, live. Granular access: Per-board roles and share links. Flow metrics: Cycle time and throughput built in</desc>
